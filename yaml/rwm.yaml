mode: rule

ipv6: false

allow-lan: false

log-level: info

mixed-port: 12345

unified-delay: true

tcp-concurrent: true

external-controller: 127.0.0.1:9090

find-process-mode: strict

global-client-fingerprint: chrome

geodata-mode: true

geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"

  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"

  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"

  asn: "https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"

profile:
  store-selected: true

  store-fake-ip: true

hosts:
  "time.facebook.com": 17.253.84.125

  "time.android.com": 17.253.84.125

sniffer:
  enable: true

  sniff:
    HTTP:
      ports: [80, 8080-8880]

      override-destination: true

    TLS:
      ports: [443, 8443]

    QUIC:
      ports: [443, 8443]

  skip-domain:
    - "Mijia Cloud"

    - "+.push.apple.com"

dns:
  enable: true

  ipv6: true

  prefer-h3: true

  respect-rules: true

  enhanced-mode: fake-ip

  fake-ip-filter:
    - rule-set,cn

    - rule-set,fakeip-filter

    # --- 新增：强制内网域名不走 Fake-IP ---

    - "*.lan"

    - "*.local"

    - "localhost.ptlogin2.qq.com"

    - "+.msftconnecttest.com"

    - "+.msftncsi.com"


  default-nameserver: &cn
    - quic://223.5.5.5

    - quic://223.6.6.6

  nameserver:
    - tcp://8.8.8.8

    - tcp://8.8.4.4

  proxy-server-nameserver: *cn

  direct-nameserver: *cn

  nameserver-policy:
    "rule-set:cn": *cn

tun:
  enable: true

  stack: system

  device: utun-Riddler

  gso: true

  dns-hijack:
    - "any:53"

    - "tcp://any:53"

  auto-route: true

  auto-redirect: true

  auto-detect-interface: true

proxy-groups:
  - name: 默认代理

    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png

    type: select

    interval: 0

    url: &url http://www.gstatic.com/generate_204

    proxies:
      - DIRECT
  
  - name: NS

    icon: https://testingcf.jsdelivr.net/gh/shindgewongxj/WHATSINStash@master/icon/select.png

    type: select

    interval: 0

    url: *url

    proxies:
      - 默认代理

  - name: 油管视频

    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png

    type: select

    interval: 0

    url: *url

    proxies:
      - 默认代理

  - name: 谷歌服务

    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Google_Search.png

    type: select

    interval: 0

    url: *url

    proxies:
      - 默认代理

  - name: AI 服务

    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Bot.png

    type: select

    interval: 0

    url: *url

    proxies:
      - 默认代理

  - name: 电报消息

    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png

    type: select

    interval: 0

    url: *url

    proxies:
      - 默认代理

  - name: 流媒体

    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Netflix.png

    type: select

    interval: 0

    url: *url

    proxies:
      - 默认代理

  - name: Tiktok

    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/TikTok.png

    type: select

    interval: 0

    url: *url

    proxies:
      - 默认代理

  - name: Spotify

    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Spotify.png

    type: select

    interval: 0

    url: *url

    proxies:
      - 默认代理

  - name: 国内服务

    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/DomesticMedia.png

    type: select

    interval: 0

    proxies:
      - DIRECT

      - 默认代理

  - name: 广告

    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/AdBlack.png

    type: select

    interval: 0

    url: *url

    proxies:
      - REJECT

      - REJECT-DROP

      - DIRECT

      - 默认代理

  - name: 漏网之鱼

    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Final.png

    type: select

    interval: 0

    url: *url

    proxies:
      - 默认代理

      - DIRECT

